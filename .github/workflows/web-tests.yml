# The web workspace's own gate — this repo is a shared submodule consumed by more
# than one host repo, so its suites must run AT THE SOURCE on every push/PR, not
# only inside a consumer's CI at whatever pinned SHA it happens to hold.
name: web-tests

on:
  push:
    branches: [main]
    # The submodule gitlink is in this list because bumping it is precisely when the
    # copied chat contract goes stale — the copy's own file never changes, so a
    # packages/web-only filter would skip the run that had something to catch.
    paths:
      - "packages/web/**"
      - "external/agenticdevelopertoolkit"
      - ".github/workflows/web-tests.yml"
  pull_request:
    # The submodule gitlink is in this list because bumping it is precisely when the
    # copied chat contract goes stale — the copy's own file never changes, so a
    # packages/web-only filter would skip the run that had something to catch.
    paths:
      - "packages/web/**"
      - "external/agenticdevelopertoolkit"
      - ".github/workflows/web-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      # `submodules: recursive` is load-bearing, not hygiene: packages/features/bitbag
      # and packages/persona carry `link:` deps into external/agenticdevelopertoolkit,
      # and a `link:` to a missing directory fails at install time with an error that
      # names a path rather than a cause. The submodule is public, so no token is needed.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Pure-Python, no toolchain — run it before install so a stale copy fails in
      # seconds rather than after the whole workspace builds. Self-test first: a guard
      # whose failing case has rotted passes vacuously and is worse than no guard.
      - name: chat contract copy is in sync
        run: |
          python3 tools/verify_chat_types_copy_test.py
          python3 tools/verify_chat_types_copy.py
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Per-package vitest suites (the root `test` script is the same recursive run).
      # Deliberately NOT `lint`: the dormant `controls` package carries pre-existing
      # type rot (it's excluded from every consumer's build filters — `layout` and
      # `content`, named here until 8e6c123 deleted them, were the other two),
      # and per-package tsc resolves sibling DIST types that a fresh checkout hasn't
      # built — gate types in consumers (which build first) until that's untangled.
      - run: pnpm -r --if-present run test
