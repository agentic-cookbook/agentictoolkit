name: AgenticToolkit
options:
  bundleIdPrefix: com.mikefullerton.agentictoolkit
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  groupSortPosition: top
  generateEmptyDirectories: false
  xcodeVersion: "2640"

settings:
  base:
    SWIFT_VERSION: "6.3"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SDKROOT: macosx
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_TESTABILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_MODULE_VERIFIER: YES
    GENERATE_INFOPLIST_FILE: YES
    MODULE_VERIFIER_SUPPORTED_LANGUAGE_STANDARDS: "gnu11 gnu++14"
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
    LM_FILTER_WARNINGS: YES
    OTHER_LDFLAGS: "$(inherited) -weak_framework AppIntents"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    PRODUCT_NAME: $(TARGET_NAME)

targetTemplates:
  SwiftLint:
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            export PATH="/opt/homebrew/bin:$PATH"
          fi
          if which swiftlint >/dev/null; then
            swiftlint lint --quiet --strict
          else
            echo "warning: SwiftLint not installed; brew install swiftlint to enable"
          fi

packages:
  CodeEditLanguages:
    url: https://github.com/CodeEditApp/CodeEditLanguages.git
    exactVersion: "0.1.20"
  CodeEditSourceEditor:
    url: https://github.com/CodeEditApp/CodeEditSourceEditor.git
    minVersion: "0.15.2"
    maxVersion: "1.0.0"
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    minVersion: "1.2.0"
    maxVersion: "2.0.0"
  ModelContextProtocol:
    url: https://github.com/modelcontextprotocol/swift-sdk
    minVersion: "0.11.0"
    maxVersion: "1.0.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"

targets:
  AIPluginKit:
    type: framework
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - AIPluginKit
    dependencies:
      - target: AgenticToolkitCore

  AgenticToolkitCore:
    type: framework
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - path: Core
      - path: macOS/Features/AIChatWindow/ChatBackend.swift
        group: Core
    dependencies:
      - package: ModelContextProtocol
        product: MCP

  AgenticToolkitCoreUI:
    type: framework
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - CoreUI
    dependencies:
      - target: AgenticToolkitCore

  AgenticToolkitCoreMacOS:
    type: framework
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - path: CoreMacOS
      - path: macOS/UI/Settings/SettingStorage/RGBAColor+NSColor.swift
        group: CoreMacOS
    dependencies:
      - target: AgenticToolkitCore
      - target: AgenticToolkitCoreUI

  AgenticToolkitMacOS:
    type: framework
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - path: macOS
        excludes:
          - "Features/AIChatWindow/ChatBackend.swift"
          - "Features/SessionWatcher/Old/OldSessionWindowPanelViewController.swift"
          - "Features/SessionWatcher/Old/OldSessionWindowSettingsPane.swift"
          # Whole folder, not just the one file it contains (built into
          # AgenticToolkitCoreMacOS instead, see that target's sources
          # above): excluding only the file left an empty "UI/Settings"
          # directory that XcodeGen still generated an orphaned PBXGroup
          # for despite generateEmptyDirectories: false, causing spurious
          # TEMP_ UUID churn in project.pbxproj on every regeneration.
          - "UI/Settings"
    dependencies:
      - target: AgenticToolkitCore
      - target: AgenticToolkitCoreUI
      - target: AgenticToolkitCoreMacOS
      - target: AgenticToolkitPermissions
      - target: AgenticToolkitPermissionsUI
      - target: AIPluginKit
      - package: SwiftTerm
      - package: CodeEditSourceEditor
      - package: CodeEditLanguages
      - package: KeyboardShortcuts

  AgenticToolkitPermissions:
    type: framework
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - Permissions
    # Daemon-safe: Foundation + ApplicationServices (AX) + CoreServices (Apple
    # Events) + UserNotifications, all auto-linked via import. No AppKit.

  AgenticToolkitPermissionsUI:
    type: framework
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - PermissionsUI
    dependencies:
      - target: AgenticToolkitPermissions
    # AppKit settings panel (toolkit convention: AppKit, not SwiftUI). No
    # ComposableSettings dependency — hosts wrap PermissionsPanelView themselves.

  AgenticToolkitDatabase:
    type: framework
    supportedDestinations: [macOS, iOS]
    templates:
      - SwiftLint
    sources:
      - Database
    dependencies:
      - package: GRDB
        product: GRDB
      - sdk: libsqlite3.tbd
    settings:
      base:
        SDKROOT: auto
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    # Daemon-safe: a GRDB DatabasePool with deadline-ejection (progress_handler),
    # read/write reentrancy (read-your-writes), and per-lane stats. Foundation +
    # GRDB + system SQLite only; no AppKit.

  AgenticToolkitDatabaseTests:
    type: bundle.unit-test
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - Tests/AgenticToolkitDatabaseTests
    dependencies:
      - target: AgenticToolkitDatabase
        embed: true
        codeSign: true
      - package: GRDB
        product: GRDB

  AgenticToolkitSync:
    type: framework
    supportedDestinations: [macOS, iOS]
    templates:
      - SwiftLint
    sources:
      - Sync
    settings:
      base:
        SDKROOT: auto
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    # Daemon-safe: the offline-sync engine + protocol seam (SyncStore/
    # SyncTransport/SyncTriggerSource). Foundation + Network only; no AppKit.

  AgenticToolkitSyncTests:
    type: bundle.unit-test
    platform: macOS
    templates:
      - SwiftLint
    sources:
      # The plain folder scan above already picks up Fixtures/*.json as
      # individually-registered resources; an explicit `type: folder`
      # entry for the same path double-registers it (a folder reference
      # in Resources AND the three flat file copies). Flat copies only.
      - Tests/AgenticToolkitSyncTests
    dependencies:
      - target: AgenticToolkitSync
        embed: true
        codeSign: true

  AgenticToolkitSyncGRDB:
    type: framework
    supportedDestinations: [macOS, iOS]
    templates:
      - SwiftLint
    sources:
      - SyncGRDB
    dependencies:
      - target: AgenticToolkitSync
      - target: AgenticToolkitDatabase
      - package: GRDB
        product: GRDB
      - sdk: libsqlite3.tbd
    settings:
      base:
        SDKROOT: auto
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    # Daemon-safe: SyncStore implementation on BoundedDatabase (WAL pool).

  AgenticToolkitSyncGRDBTests:
    type: bundle.unit-test
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - Tests/AgenticToolkitSyncGRDBTests
    dependencies:
      - target: AgenticToolkitSyncGRDB
        embed: true
        codeSign: true
      - target: AgenticToolkitSync
        embed: true
        codeSign: true
      - target: AgenticToolkitDatabase
        embed: true
        codeSign: true
      - package: GRDB
        product: GRDB

  AgenticToolkitCoreTests:
    type: bundle.unit-test
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - Tests/AgenticToolkitCoreTests
    dependencies:
      - target: AgenticToolkitCore
        embed: true
        codeSign: true

  AgenticToolkitCoreUITests:
    type: bundle.unit-test
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - Tests/AgenticToolkitCoreUITests
    dependencies:
      - target: AgenticToolkitCoreUI
        embed: true
        codeSign: true
      - target: AgenticToolkitCore
        embed: true
        codeSign: true

  AgenticToolkitCoreMacOSTests:
    type: bundle.unit-test
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - Tests/AgenticToolkitCoreMacOSTests
    dependencies:
      - target: AgenticToolkitCoreMacOS
        embed: true
        codeSign: true
      - target: AgenticToolkitCore
        embed: true
        codeSign: true

  AIPluginKitTests:
    type: bundle.unit-test
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - Tests/AIPluginKitTests
    dependencies:
      - target: AIPluginKit
        embed: true
        codeSign: true
      - target: AgenticToolkitCore
        embed: true
        codeSign: true

  AgenticToolkitPermissionsTests:
    type: bundle.unit-test
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - Tests/AgenticToolkitPermissionsTests
    dependencies:
      - target: AgenticToolkitPermissions
        embed: true
        codeSign: true

  AgenticToolkitPermissionsUITests:
    type: bundle.unit-test
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - Tests/AgenticToolkitPermissionsUITests
    dependencies:
      - target: AgenticToolkitPermissionsUI
        embed: true
        codeSign: true
      - target: AgenticToolkitPermissions
        embed: true
        codeSign: true

  AgenticToolkitMacOSTests:
    type: bundle.unit-test
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - Tests/AgenticToolkitMacOSTests
    dependencies:
      - target: AgenticToolkitMacOS
        embed: true
        codeSign: true
      - target: AgenticToolkitCoreMacOS
        embed: true
        codeSign: true
      - target: AgenticToolkitCoreUI
        embed: true
        codeSign: true
      - target: AgenticToolkitCore
        embed: true
        codeSign: true

aggregateTargets:
  AgenticToolkitMacOSAll:
    targets:
      - AIPluginKit
      - AgenticToolkitCore
      - AgenticToolkitCoreUI
      - AgenticToolkitCoreMacOS
      - AgenticToolkitPermissions
      - AgenticToolkitPermissionsUI
      - AgenticToolkitMacOS
      - AgenticToolkitDatabase
      - AgenticToolkitSync
      - AgenticToolkitSyncGRDB

  AgenticToolkitMacOSTestsAll:
    targets:
      - AIPluginKit
      - AgenticToolkitCore
      - AgenticToolkitCoreMacOS
      - AgenticToolkitCoreUI
      - AgenticToolkitPermissions
      - AgenticToolkitPermissionsUI
      - AgenticToolkitMacOS
      - AIPluginKitTests
      - AgenticToolkitCoreMacOSTests
      - AgenticToolkitCoreTests
      - AgenticToolkitCoreUITests
      - AgenticToolkitPermissionsTests
      - AgenticToolkitPermissionsUITests
      - AgenticToolkitMacOSTests
      - AgenticToolkitDatabase
      - AgenticToolkitDatabaseTests
      - AgenticToolkitSync
      - AgenticToolkitSyncTests
      - AgenticToolkitSyncGRDB
      - AgenticToolkitSyncGRDBTests

schemes:
  AgenticToolkitDatabase:
    build:
      targets:
        AgenticToolkitDatabase: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgenticToolkitDatabaseTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  AgenticToolkitSync:
    build:
      targets:
        AgenticToolkitSync: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgenticToolkitSyncTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  AgenticToolkitSyncGRDB:
    build:
      targets:
        AgenticToolkitSyncGRDB: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgenticToolkitSyncGRDBTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  AIPluginKit:
    build:
      targets:
        AIPluginKit: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AIPluginKitTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  AgenticToolkitPermissions:
    build:
      targets:
        AgenticToolkitPermissions: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgenticToolkitPermissionsTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  AgenticToolkitPermissionsUI:
    build:
      targets:
        AgenticToolkitPermissionsUI: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgenticToolkitPermissionsUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  AgenticToolkitMacOS:
    build:
      targets:
        AgenticToolkitMacOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgenticToolkitCoreTests
        - AgenticToolkitCoreUITests
        - AgenticToolkitCoreMacOSTests
        - AIPluginKitTests
        - AgenticToolkitPermissionsTests
        - AgenticToolkitPermissionsUITests
        - AgenticToolkitMacOSTests
        - AgenticToolkitDatabaseTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
